name: InfinityPickaxes
version: '${version}'
main: com.infinitypickaxes.InfinityPickaxes
api-version: '26.2'
author: aland
description: Leveling pickaxes with EcoEnchants integration, interactive sockets, and duplicate quarantine.
depend:
  - EcoEnchants
  - eco
softdepend:
  - PlaceholderAPI
  - WorldGuard

commands:
  infinitypickaxes:
    description: Main command for InfinityPickaxes
    aliases: [ipickaxe, infinitypickaxe]
    permission: infinitypickaxes.use
    usage: /<command> [give|reload|setlevel|addxp|gui|duplicate]

permissions:
  infinitypickaxes.use:
    description: Allows using the Infinity Pickaxe and opening its GUI.
    default: true
  infinitypickaxes.admin:
    description: Full administrative access to InfinityPickaxes commands.
    default: op
    children:
      infinitypickaxes.admin.duplicates.view: true
      infinitypickaxes.admin.duplicates.scan: true
      infinitypickaxes.admin.duplicates.quarantine: true
      infinitypickaxes.admin.duplicates.resolve: true
      infinitypickaxes.use: true
  infinitypickaxes.admin.duplicates.view:
    default: op
  infinitypickaxes.admin.duplicates.scan:
    default: op
  infinitypickaxes.admin.duplicates.quarantine:
    default: op
  infinitypickaxes.admin.duplicates.resolve:
    default: op
