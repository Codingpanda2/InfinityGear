# Perk slot unlock milestones (Pickaxe Level -> Unlocked Slots)
slots-milestones:
  10: 1
  25: 2
  50: 3
  75: 4
  100: 5

perks:
  haste_surge:
    display-name: "<#FFD700><b>Haste Surge</b></#FFD700>"
    icon: GOLDEN_PICKAXE
    slot: 11
    enabled: true
    required-level: 10
    description:
      - "<gray>Grants permanent <yellow>Haste II</yellow> effect"
      - "<gray>while holding this pickaxe in main hand."
    amplifier: 1

  autosmelt:
    display-name: "<#FF4500><b>Auto Smelt</b></#FF4500>"
    icon: LAVA_BUCKET
    slot: 12
    enabled: true
    required-level: 25
