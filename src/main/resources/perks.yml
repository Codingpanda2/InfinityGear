  void_siphon:
    display-name: "<gradient:#9400D3:#4B0082><b>Void Siphon</b></gradient>"
    icon: END_CRYSTAL
    slot: 15
    enabled: true
    required-level: 100
    description:
      - "<gray>Supreme power: Multiplies experience gain"
      - "<gray>and doubles the activation chance of all other perks."
    xp-multiplier: 2.0
