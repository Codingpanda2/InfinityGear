# ==============================================================================
#                  INFINITY PICKAXES - MAIN MENU GUI
# ==============================================================================

title: "<gradient:#00E5FF:#0077FE><b>Infinity Pickaxe</b></gradient> <dark_gray>»</dark_gray> <gray>Main Menu"
size: 36

# Decorative filler glass
fill-item:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  # Display of the current pickaxe
  pickaxe-display:
    slot: 13
    # If copy-held-item is true, it displays the actual pickaxe held with its updated stats
    copy-held-item: true

  # Navigation Button: Enchants Sockets Menu
  enchants-button:
    slot: 20
    material: ENCHANTED_BOOK
    name: "<#00E5FF><b>Enchantment Sockets</b></#00E5FF>"
    lore:
      - "<gray>Manage and upgrade enchantments"
      - "<gray>compatible with your Infinity Pickaxe."
      - ""
      - "<gray>Sockets Used: <gold>%enchant_count%</gold><gray>/<yellow>%max_sockets%</yellow>"
      - ""
      - "<yellow>▶ Click to open sockets menu</yellow>"

  # Statistics Summary Item
  stats-info:
    slot: 22
    material: BOOK
    name: "<#00FF88><b>Mining Statistics</b></#00FF88>"
    lore:
      - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
      - "<gray>Pickaxe Level: <gold><b>%level%</b></gold><gray>/100"
      - "<gray>Current XP: <aqua>%current_xp%</aqua><gray>/<aqua>%required_xp%</aqua>"
      - "<gray>Progress: %xp_bar%"
      - "<gray>Total Mined: <yellow>%blocks_mined%</yellow> blocks"
      - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

  # Close Button
  close-button:
    slot: 31
    material: BARRIER
    name: "<red><b>Close Menu</b></red>"
    lore:
      - "<gray>Click to return to the game."
