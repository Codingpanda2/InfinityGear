# ==============================================================================
#                  INFINITY PICKAXES - ENCHANTS & SOCKETS MENU GUI
# ==============================================================================

title: "<gradient:#00E5FF:#0077FE><b>Infinity Pickaxe</b></gradient> <dark_gray>»</dark_gray> <gray>Enchantments"
size: 54

fill-item:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

# Format for each enchantment item displayed in the menu
enchant-format:
  unlocked-name: "%enchant_display_name% <gray>[<yellow>Lv. %current_level%<dark_gray>/<gold>%max_level%<gray>]"
  locked-name: "<dark_gray>🔒</dark_gray> %enchant_display_name% <red>(Locked)</red>"

  # Appended to unlocked-name for installed over-standard enchantments.
  # Placeholders: %extra_level%, %current_level%, %standard_maximum%,
  # %max_level% (alias of standard maximum), and %absolute_maximum%.
  # Set either value to "" to hide that badge without changing policy.
  limitbreak-badges:
    active: " <gradient:#FF00FF:#FFAA00><b>[LB +%extra_level%]</b></gradient>"
    maximum: " <gradient:#FF00FF:#00FFFF><b>[LB MAX]</b></gradient>"

  lore-unlocked:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "%enchant_description%"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "<gray>Current Level: <yellow>%current_level%</yellow><gray>/<gold>%max_level%</gold>"
    - "<gray>Limit for Pickaxe Level: <aqua>Lv. %current_max_for_pickaxe%</aqua>"
    - ""
    - "<white><b>Upgrade Requirement:</b></white>"
    - "<yellow>• Book of %enchant_display_name% <gold>Lv. %required_book_level%</gold></yellow>"
    - ""
    - "<green>▶ Click the book in your inventory, then</green>"
    - "<green>  click this socket with it on your cursor.</green>"
    - "<dark_green>  Tip: shift-click the book to apply it directly.</dark_green>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

  lore-maxed:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "%enchant_description%"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "<gold><b>MAXIMUM LEVEL REACHED!</b></gold>"
    - "<gray>Current Level: <green>%current_level%</green><gray>/<gold>%max_level%</gold>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

  lore-locked:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "%enchant_description%"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "<red><b>LOCKED SOCKET</b></red>"
    - "<gray>Requires your pickaxe to be <yellow>Level %unlock_level%</yellow>."
    - "<gray>Current pickaxe level: <aqua>%pickaxe_level%</aqua>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

items:
  # Shown when the socket catalog cannot render any entries. These two states
  # remain separate so a missing provider can be distinguished from a policy
  # where every discovered enchantment was intentionally disabled.
  empty-sockets:
    slot: 22
    material: BARRIER
    none-discovered:
      name: "<red><b>No Enchantment Sockets Available</b></red>"
      lore:
        - "<red>No pickaxe EcoEnchants were discovered.</red>"
        - ""
        - "<gray>Check the server log for the loaded socket count.</gray>"
        - "<gray>After EcoEnchants loads or reloads, run:</gray>"
        - "<yellow>/ipickaxe reload</yellow>"
    all-disabled:
      name: "<red><b>No Enchantment Sockets Available</b></red>"
      lore:
        - "<red>All discovered enchantments are disabled in enchants.yml.</red>"
        - ""
        - "<gray>Enable at least one compatible policy entry, then run:</gray>"
        - "<yellow>/ipickaxe reload</yellow>"

  # Page numbers are one-based. %current_page%, %target_page%, and
  # %total_pages% are available in both names and lore. A negative slot keeps
  # the dynamic first/last slot of the bottom row.
  pagination:
    previous:
      slot: -1
      material: SPECTRAL_ARROW
      name: "<yellow><b>« Previous Page (%target_page%/%total_pages%)</b></yellow>"
      lore:
        - "<gray>Currently viewing page %current_page%.</gray>"
    next:
      slot: -1
      material: SPECTRAL_ARROW
      name: "<yellow><b>Next Page (%target_page%/%total_pages%) »</b></yellow>"
      lore:
        - "<gray>Currently viewing page %current_page%.</gray>"

  # Information Guide
  info-book:
    slot: 4
    material: KNOWLEDGE_BOOK
    name: "<#00FF88><b>How to Upgrade Sockets?</b></#00FF88>"
    lore:
      - "<gray>Managed sockets: <yellow>%used_sockets%</yellow><gray>/<gold>%max_sockets%</gold>"
      - "<gray>Current LimitBreak allowance: <light_purple>+%limitbreak_extra%</light_purple>"
      - "<gray>LimitBreak unlock level: <yellow>%limitbreak_unlock_level%</yellow>"
      - ""
      - "<gray>To install an enchantment target level:"
      - "<white>1.</white> <gray>Obtain one managed book at a <yellow>higher level</yellow>"
      - "   <gray>than the level currently installed."
      - "<white>2.</white> <gray>Click the book in your inventory to pick it up."
      - "<white>3.</white> <gray>Click the matching socket with it on your cursor."
      - "   <dark_gray>Or shift-click the book for quick apply.</dark_gray>"
      - "<white>4.</white> <gray>The book's exact level is installed when valid."
      - ""
      - "<dark_gray>Efficiency is free; Fortune and Silk Touch consume sockets.</dark_gray>"

  # Back Button to Main Menu
  back-button:
    slot: 49
    material: ARROW
    name: "<yellow><b>Back to Main Menu</b></yellow>"
    lore:
      - "<gray>Click to return."
