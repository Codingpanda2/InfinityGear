# ==============================================================================
#                  INFINITY PICKAXES - ENCHANTS & SOCKETS MENU GUI
# ==============================================================================

title: "<gradient:#00E5FF:#0077FE><b>Infinity Pickaxe</b></gradient> <dark_gray>»</dark_gray> <gray>Enchantments"
size: 54

fill-item:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

# Format for each enchantment item displayed in the menu
enchant-format:
  unlocked-name: "%enchant_display_name% <gray>[<yellow>Lv. %current_level%<dark_gray>/<gold>%max_level%<gray>]"
  locked-name: "<dark_gray>🔒</dark_gray> %enchant_display_name% <red>(Locked)</red>"

  lore-unlocked:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "%enchant_description%"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "<gray>Current Level: <yellow>%current_level%</yellow><gray>/<gold>%max_level%</gold>"
    - "<gray>Limit for Pickaxe Level: <aqua>Lv. %current_max_for_pickaxe%</aqua>"
    - ""
    - "<white><b>Upgrade Requirement:</b></white>"
    - "<yellow>• Book of %enchant_display_name% <gold>Lv. %required_book_level%</gold></yellow>"
    - ""
    - "<green>▶ Drag & drop matching book or</green>"
    - "<green>  click socket with book on cursor.</green>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

  lore-maxed:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "%enchant_description%"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "<gold><b>MAXIMUM LEVEL REACHED!</b></gold>"
    - "<gray>Current Level: <green>%current_level%</green><gray>/<gold>%max_level%</gold>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

  lore-locked:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "%enchant_description%"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "<red><b>LOCKED SOCKET</b></red>"
    - "<gray>Requires your pickaxe to be <yellow>Level %unlock_level%</yellow>."
    - "<gray>Current pickaxe level: <aqua>%pickaxe_level%</aqua>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

items:
  # Information Guide
  info-book:
    slot: 4
    material: KNOWLEDGE_BOOK
    name: "<#00FF88><b>How to Upgrade Sockets?</b></#00FF88>"
    lore:
      - "<gray>Managed sockets: <yellow>%used_sockets%</yellow><gray>/<gold>%max_sockets%</gold>"
      - "<gray>Current LimitBreak allowance: <light_purple>+%limitbreak_extra%</light_purple>"
      - "<gray>LimitBreak unlock level: <yellow>%limitbreak_unlock_level%</yellow>"
      - ""
      - "<gray>To level up an enchantment:"
      - "<white>1.</white> <gray>Obtain an enchanted book of the <yellow>same level</yellow>"
      - "   <gray>your pickaxe currently has."
      - "<white>2.</white> <gray>Click the socket or drag the book"
      - "   <gray>directly onto the desired slot."
      - "<white>3.</white> <gray>The book will be consumed and pickaxe upgraded!"
      - ""
      - "<dark_gray>Vanilla enchantments do not consume sockets.</dark_gray>"

  # Back Button to Main Menu
  back-button:
    slot: 49
    material: ARROW
    name: "<yellow><b>Back to Main Menu</b></yellow>"
    lore:
      - "<gray>Click to return."
