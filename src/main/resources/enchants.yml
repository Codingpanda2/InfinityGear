# ==============================================================================
#                  INFINITY PICKAXES - ENCHANTMENTS CONFIGURATION
# ==============================================================================
# Dynamic socket limits and scaling per pickaxe level.
# Only REAL enchantments present on the server will be loaded.

settings:
  # Automatically detect and register any compatible EcoEnchants pickaxe enchantments present on the server
  auto-register-ecoenchants: true
  # Sound when upgrading an enchantment socket successfully
  upgrade-sound:
    sound: BLOCK_ANVIL_USE
    volume: 1.0
    pitch: 1.1

# Sockets and Enchantments mapping
enchants:

  # ----------------------------------------------------------------------------
  # VANILLA BASIC ENCHANTMENTS
  # ----------------------------------------------------------------------------
  efficiency:
    key: "minecraft:efficiency"
    display-name: "<#00E5FF><b>Eficiencia</b></#00E5FF>"
    icon: ENCHANTED_BOOK
    slot: 10
    enabled: true
    unlock-pickaxe-level: 0
    max-level: 25
    description:
      - "<gray>Aumenta considerablemente la velocidad de minado."
    level-scaling:
      0: 5
      10: 10
      25: 15
      50: 20
      75: 25

  fortune:
    key: "minecraft:fortune"
    display-name: "<#FFA500><b>Fortuna</b></#FFA500>"
    icon: ENCHANTED_BOOK
    slot: 11
    enabled: true
    unlock-pickaxe-level: 0
    max-level: 10
    description:
      - "<gray>Multiplica los minerales y gemas soltados."
    level-scaling:
      0: 3
      25: 5
      50: 7
      75: 10

  silk_touch:
    key: "minecraft:silk_touch"
    display-name: "<#9966FF><b>Toque de Seda</b></#9966FF>"
    icon: ENCHANTED_BOOK
    slot: 12
    enabled: true
    unlock-pickaxe-level: 15
    max-level: 1
    description:
      - "<gray>Permite recolectar bloques en su forma original."
