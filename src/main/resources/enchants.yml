# ==============================================================================
#                  INFINITY PICKAXES - ENCHANTMENTS CONFIGURATION
# ==============================================================================
# Dynamic socket limits and scaling per pickaxe level.
# EcoEnchants compatible enchantments are automatically registered and can be configured here.

settings:
  # Automatically detect and register newly discovered EcoEnchants on startup
  auto-register-ecoenchants: true
  # Sound when upgrading an enchantment socket successfully
  upgrade-sound:
    sound: BLOCK_ANVIL_USE
    volume: 1.0
    pitch: 1.1

# Sockets and Enchantments mapping
enchants:

  # ----------------------------------------------------------------------------
  # VANILLA / BASIC ENCHANTMENTS (Disponibles desde Nivel 0)
  # ----------------------------------------------------------------------------
  efficiency:
    key: "minecraft:efficiency"
    display-name: "<#00E5FF><b>Eficiencia</b></#00E5FF>"
    icon: ENCHANTED_BOOK
    slot: 10
    enabled: true
    unlock-pickaxe-level: 0
    max-level: 25
    description:
      - "<gray>Aumenta considerablemente la velocidad de minado."
    # Dynamic scaling of max allowed enchant level based on pickaxe level:
    level-scaling:
      0: 5
      10: 10
      25: 15
      50: 20
      75: 25

  fortune:
    key: "minecraft:fortune"
    display-name: "<#FFA500><b>Fortuna</b></#FFA500>"
    icon: ENCHANTED_BOOK
    slot: 11
    enabled: true
    unlock-pickaxe-level: 0
    max-level: 10
    description:
      - "<gray>Multiplica los minerales y gemas soltados."
    level-scaling:
      0: 3
      25: 5
      50: 7
      75: 10

  silk_touch:
    key: "minecraft:silk_touch"
    display-name: "<#9966FF><b>Toque de Seda</b></#9966FF>"
    icon: ENCHANTED_BOOK
    slot: 12
    enabled: true
    unlock-pickaxe-level: 15
    max-level: 1
    description:
      - "<gray>Permite recolectar bloques en su forma original."

  # ----------------------------------------------------------------------------
  # ECOENCHANTS / ADVANCED ENCHANTMENTS (Desbloqueo Progresivo 10 a 100)
  # ----------------------------------------------------------------------------
  telepathy:
    key: "ecoenchants:telepathy"
    display-name: "<#33CCFF><b>Telepatía</b></#33CCFF>"
    icon: ENCHANTED_BOOK
    slot: 19
    enabled: true
    unlock-pickaxe-level: 10
    max-level: 1
    description:
      - "<gray>Envía los bloques minados directamente a tu inventario."

  autosmelt:
    key: "ecoenchants:autosmelt"
    display-name: "<#FF6600><b>Autofundición</b></#FF6600>"
    icon: ENCHANTED_BOOK
    slot: 20
    enabled: true
    unlock-pickaxe-level: 20
    max-level: 3
    description:
      - "<gray>Funde automáticamente los minerales extraídos."
    level-scaling:
      20: 1
      40: 2
      60: 3

  explosive:
    key: "ecoenchants:explosive"
    display-name: "<#FF2200><b>Explosivo</b></#FF2200>"
    icon: ENCHANTED_BOOK
    slot: 21
    enabled: true
    unlock-pickaxe-level: 30
    max-level: 5
    description:
      - "<gray>Detona y destruye un área de bloques al minar."
    level-scaling:
      30: 1
      50: 2
      70: 3
      85: 4
      100: 5

  jackhammer:
    key: "ecoenchants:jackhammer"
    display-name: "<#FFFF33><b>Martillo Neumático</b></#FFFF33>"
    icon: ENCHANTED_BOOK
    slot: 22
    enabled: true
    unlock-pickaxe-level: 45
    max-level: 5
    description:
      - "<gray>Rompe capas enteras de bloques de un solo golpe."
    level-scaling:
      45: 1
