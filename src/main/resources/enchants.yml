# InfinityPickaxes policy for the live EcoEnchants catalogue.
# Enchantment names, effects, targets, native conflicts, descriptions, and native
# maximum levels are always read live from EcoEnchants and cannot be overridden here.
settings:
  upgrade-sound:
    sound: BLOCK_ANVIL_USE
    volume: 1.0
    pitch: 1.1

socket-milestones:
  0: 3
  10: 4
  25: 6
  50: 8
  75: 10

limitbreak:
  unlock-level: 50
  extra-levels:
    50: 1
    75: 3
    100: 5

# Entries for newly discovered pickaxe-compatible EcoEnchants are appended here.
# Existing entries and administrator edits are never overwritten or deleted.
enchants: {}
