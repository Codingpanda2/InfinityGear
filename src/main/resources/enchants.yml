      - "<gray>Genera tokens y monedas especiales al minar bloques."
    level-scaling:
      60: 1
      75: 2
      90: 3
      100: 5

  laser:
    key: "ecoenchants:laser"
    display-name: "<#FF0055><b>Rayo Láser</b></#FF0055>"
    icon: ENCHANTED_BOOK
    slot: 25
    enabled: true
    unlock-pickaxe-level: 75
    max-level: 3
    description:
      - "<gray>Dispara un rayo continuo que desintegra bloques a distancia."
    level-scaling:
      75: 1
