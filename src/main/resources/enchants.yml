      80: 3
      95: 4
      100: 5

  drill:
    key: "ecoenchants:drill"
    display-name: "<#FFCC00><b>Taladro</b></#FFCC00>"
    icon: ENCHANTED_BOOK
    slot: 23
    enabled: true
    unlock-pickaxe-level: 50
    max-level: 5
    description:
      - "<gray>Perfora túneles largos en la dirección en que miras."
    level-scaling:
      50: 1
