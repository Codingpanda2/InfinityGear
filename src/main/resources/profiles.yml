# InfinityGear profiles are stable policy identities. Only the migrated pickaxe
# profile auto-converts vanilla items by default.
# To create a profile from a Nexo visual template, configure:
#   external-items: {nexo: [my_pack:my_item]}
#   default-item: {provider: nexo, id: my_pack:my_item}
# InfinityGear stamps its own UUID; a raw Nexo item is never protected gear.
#
# Each profile has a sparse enchantment-overrides map. Leave it as {} when the
# profile has no exceptions. To add one later, use the canonical namespaced
# enchantment key and specify only values that should differ from enchants.yml;
# omitted values inherit the global policy. The intended shape is:
#
#   enchantment-overrides:
#     "minecraft:veinminer":
#       enabled: true
#       unlock-level: 75
#       standard-maximum: 1
#       absolute-maximum: 3
#       socket-cost: 1
#       additional-conflicts:
#         - "minecraft:dynamite"
#       removable: true
#       cost-weight: 2.0
#
# Quote namespaced keys to keep the YAML unambiguous. Do not duplicate global
# enchantment entries unless a profile genuinely needs different policy.
config-version: 1
profiles:
  infinitygear:pickaxe:
    enabled: true
    accepted-materials: [WOODEN_PICKAXE, STONE_PICKAXE, IRON_PICKAXE, GOLDEN_PICKAXE, DIAMOND_PICKAXE, NETHERITE_PICKAXE]
    default-material: NETHERITE_PICKAXE
    progression: EXPERIENCE
    maximum-level: 100
    base-sockets: 3
    maximum-expanded-sockets: 12
    socket-milestones: {10: 4, 25: 6, 50: 8, 75: 10}
    compatible-targets: [TOOL, PICKAXE]
    enchantment-overrides: {}
    unbreakable: true
    auto-convert: false
    xp-sources:
      BLOCK_BREAK: 1.0
    cost-multiplier: 1.0
    display-name: "<gradient:#00E5FF:#0077FE><b>INFINITY PICKAXE</b></gradient>"
    lore:
      - "<gray>Level: <gold>%level%</gold>"
      - "<gray>Progress: %xp_bar%</gray>"
      - "<gray>Mined Blocks: <yellow>%blocks_mined%</yellow></gray>"
  infinitygear:axe:
    enabled: true
    accepted-materials: [WOODEN_AXE, STONE_AXE, IRON_AXE, GOLDEN_AXE, DIAMOND_AXE, NETHERITE_AXE]
    default-material: NETHERITE_AXE
    progression: STATIC
    maximum-level: 0
    base-sockets: 3
    maximum-expanded-sockets: 8
    compatible-targets: [TOOL, AXE]
    enchantment-overrides: {}
    unbreakable: true
    auto-convert: false
    cost-multiplier: 1.0
