# ==============================================================================
#                  INFINITY PICKAXES - SPANISH LOCALIZATION (es)
# ==============================================================================

prefix: "<gradient:#00E5FF:#0077FE><b>InfinityPickaxes</b></gradient> <dark_gray>»</dark_gray> "

# Real-time Action Bar sent on every block mined
mining-actionbar:
  enabled: true
  streak-timeout-ms: 2500
  message: "<gradient:#00FF88:#00E5FF><b>+%gained_xp% XP</b></gradient> <dark_gray>┃</dark_gray> %xp_bar% <dark_gray>┃</dark_gray> <yellow>%current_xp%<gray>/<yellow>%required_xp% XP <dark_gray>(<gold>Nv.%level%<dark_gray>)"

messages:
  no-permission: "<red>No tienes permisos suficientes para ejecutar este comando.</red>"
  player-only: "<red>Este comando solo puede ser ejecutado por jugadores en el servidor.</red>"
  player-not-found: "<red>El jugador especificado no fue encontrado o está desconectado.</red>"
  reload-success: "<green>¡Todas las configuraciones, idiomas y menús han sido recargados con éxito!</green>"

  # Pickaxe Interactions
  pickaxe-given: "<green>Has entregado un Infinity Pickaxe (Nv. <yellow>%level%</yellow>) a <aqua>%player%</aqua>.</green>"
  pickaxe-received: "<green>¡Has recibido un <gradient:#00E5FF:#0077FE><b>Infinity Pickaxe</b></gradient> nivel <yellow>%level%</yellow>!</green>"
  set-level-success: "<green>Se ha establecido el nivel del pico en <yellow>%level%</yellow>.</green>"
  add-xp-success: "<green>Se han añadido <yellow>%xp% XP</yellow> al pico de <aqua>%player%</aqua>.</green>"
  must-hold-pickaxe: "<red>Debes sostener un Infinity Pickaxe en tu mano principal.</red>"

  # Level Up Notifications
  level-up-chat:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<center><gradient:#00FF88:#00E5FF><b>¡SUBIDA DE NIVEL DE PICO!</b></gradient></center>"
    - "<center><gray>Tu pico ha alcanzado el <gold><b>Nivel %level%</b></gold></center>"
    - "%unlocks_summary%"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
  level-up-unlocks-summary: "<center><green>Nuevos límites de encantamiento y habilidades disponibles</green></center>"
  level-up-title: "<gradient:#00FF88:#00E5FF><b>¡NIVEL %level%!</b></gradient>"
  level-up-subtitle: "<gray>¡Nuevos sockets y habilidades desbloqueados!</gray>"
  level-up-actionbar: "<green>+1 Nivel de Pico <dark_gray>(<yellow>Nv.%level%<dark_gray>)</green>"

  # Enchantment Upgrades
  enchant-upgraded: "<green>¡Has mejorado el encantamiento <aqua>%enchant%</aqua> a <yellow>Nivel %level%</yellow>!</green>"
  enchant-max-reached: "<red>Este encantamiento ya se encuentra en su nivel máximo para tu nivel de pico (<yellow>Máx: %max%</yellow>).</red>"
  enchant-locked-pickaxe-level: "<red>Tu pico requiere ser <yellow>Nivel %required%</yellow> para desbloquear este socket.</red>"
  enchant-invalid-book: "<red>Debes colocar un libro de <aqua>%enchant%</aqua> <yellow>Nivel %required_book_level%</yellow> para mejorar este socket.</red>"
  enchant-no-book-in-hand: "<red>No tienes el libro requerido en tu cursor para aplicar la mejora.</red>"

  # LimitBreak & Libros Especiales
  limitbreak-upgraded: "<gradient:#FF00FF:#00FFFF><b>✦ ¡LIMITBREAK APLICADO! ✦</b></gradient> <green>¡Has mejorado <aqua>%enchant%</aqua> a <yellow>Nivel %level%</yellow>!%limitbreak_indicator%</green>"
  limitbreak-max-reached: "<red>Este encantamiento ha alcanzado el límite absoluto de LimitBreak (<yellow>Máx: %max%</yellow>, incluye +%extra% niveles extra).</red>"
  limitbreak-invalid-target: "<red>Este libro LimitBreak pertenece a otro encantamiento: <aqua>%enchant%</aqua>.</red>"
  limitbreak-locked-pickaxe-level: "<red>Tu pico requiere ser <yellow>Nivel %required%</yellow> para aplicar LimitBreak a <aqua>%enchant%</aqua>.</red>"
  limitbreak-book-received: "<green>¡Has recibido <yellow>%amount%x</yellow> <gradient:#FF0055:#FFAA00><b>Libro LimitBreak: %enchant% +1</b></gradient>!</green>"
  limitbreak-universal-received: "<green>¡Has recibido <yellow>%amount%x</yellow> <gradient:#FF00FF:#00FFFF><b>✦ SÚPER LIBRO UNIVERSAL +1 ✦</b></gradient>!</green>"
  limitbreak-book-given: "<green>Has entregado <yellow>%amount%x</yellow> libro LimitBreak (<aqua>%enchant%</aqua>) a <yellow>%player%</yellow>.</green>"

  # Perks
  perk-unlocked: "<green>¡Has desbloqueado el perk <gold>%perk%</gold>!</green>"
  perk-equipped: "<green>Perk <gold>%perk%</gold> equipado exitosamente.</green>"
  perk-unequipped: "<yellow>Perk <gold>%perk%</gold> desequipado.</yellow>"
  perk-locked: "<red>Este perk requiere que tu pico sea <yellow>Nivel %required%</yellow>.</red>"
  perk-max-slots: "<red>Has alcanzado el límite máximo de perks equipados para tu nivel.</red>"
