# ==============================================================================
#                  INFINITY PICKAXES - ENGLISH LOCALIZATION (en)
# ==============================================================================

prefix: "<gradient:#00E5FF:#0077FE><b>InfinityGear</b></gradient> <dark_gray>»</dark_gray> "

# Real-time Action Bar sent on every block mined
mining-actionbar:
  enabled: true
  streak-timeout-ms: 2500
  message: "<gradient:#00FF88:#00E5FF><b>+%gained_xp% XP</b></gradient> <dark_gray>┃</dark_gray> %xp_bar% <dark_gray>┃</dark_gray> <yellow>%current_xp%<gray>/<yellow>%required_xp% XP <dark_gray>(<gold>Lv.%level%<dark_gray>)"

messages:
  enchant-invalid-single-book: "<red>An application book must contain exactly one managed enchantment.</red>"
  limitbreak-missing-enchantment: "<red>%enchant% must already be installed before LimitBreak can be used.</red>"
  limitbreak-premature: "<red>%enchant% must first reach its standard maximum of %max%.</red>"
  pickaxe-quarantined: "<red>This pickaxe is quarantined because its UUID was duplicated. Contact an administrator.</red>"
  enchant-conflict: "<red>%enchant% cannot be applied because of a native or configured conflict, requirement, or invalid target.</red>"
  no-permission: "<red>You don't have permission to execute this command.</red>"
  player-only: "<red>This command can only be executed by in-game players.</red>"
  player-not-found: "<red>The specified player was not found or is offline.</red>"
  reload-success: "<green>All configurations, locales, and menus have been reloaded successfully!</green>"

  # Pickaxe Interactions
  pickaxe-given: "<green>You gave an Infinity Pickaxe (Lv. <yellow>%level%</yellow>) to <aqua>%player%</aqua>.</green>"
  pickaxe-received: "<green>You received an <gradient:#00E5FF:#0077FE><b>Infinity Pickaxe</b></gradient> level <yellow>%level%</yellow>!</green>"
  set-level-success: "<green>Pickaxe level set to <yellow>%level%</yellow>.</green>"
  add-xp-success: "<green>Added <yellow>%xp% XP</yellow> to <aqua>%player%</aqua>'s pickaxe.</green>"
  must-hold-pickaxe: "<red>You must hold an Infinity Pickaxe in your main hand.</red>"

  # Level Up Notifications
  level-up-chat:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
    - "<center><gradient:#00FF88:#00E5FF><b>PICKAXE LEVEL UP!</b></gradient></center>"
    - "<center><gray>Your pickaxe has reached <gold><b>Level %level%</b></gold></center>"
    - "%unlocks_summary%"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray>"
  level-up-unlocks-summary: "<center><green>Your pickaxe progression has increased!</green></center>"
  level-up-sockets-unlocked: "<center><green>Managed enchantment sockets increased to <yellow>%sockets%</yellow>.</green></center>"
  level-up-limitbreak-unlocked: "<center><light_purple>LimitBreak is now unlocked.</light_purple></center>"
  level-up-limitbreak-increased: "<center><light_purple>LimitBreak allowance increased to +%extra%.</light_purple></center>"
  level-up-title: "<gradient:#00FF88:#00E5FF><b>LEVEL %level%!</b></gradient>"
  level-up-subtitle: "<gray>Your pickaxe has grown stronger.</gray>"
  level-up-actionbar: "<green>+1 Pickaxe Level <dark_gray>(<yellow>Lv.%level%<dark_gray>)</green>"

  # Enchantment Upgrades
  enchant-upgraded: "<green>Upgraded enchantment <aqua>%enchant%</aqua> to <yellow>Level %level%</yellow>!</green>"
  enchant-max-reached: "<red>This enchantment is already at the maximum allowed level for your pickaxe (<yellow>Max: %max%</yellow>).</red>"
  enchant-sockets-full: "<red>This pickaxe has no free managed enchantment sockets (<yellow>%used%/%max%</yellow>). Existing enchantments remain usable and upgradeable.</red>"
  enchant-locked-pickaxe-level: "<red>Your pickaxe must be <yellow>Level %required%</yellow> to unlock this socket.</red>"
  enchant-invalid-book: "<red>Use one <aqua>%enchant%</aqua> book above the current level and no higher than <yellow>%required_book_level%</yellow>.</red>"
  enchant-no-book-in-hand: "<red>You do not have the required enchanted book in your hand/cursor.</red>"
  enchant-use-socket-menu: "<red>Managed enchantment books must be applied at the configured Runic Table.</red>"

  # LimitBreak & Special Books
  limitbreak-upgraded: "<gradient:#FF00FF:#00FFFF><b>✦ LIMITBREAK APPLIED! ✦</b></gradient> <green>Upgraded <aqua>%enchant%</aqua> to <yellow>Level %level%</yellow>!%limitbreak_indicator%</green>"
  limitbreak-max-reached: "<red>This enchantment has reached the absolute LimitBreak maximum (<yellow>Max: %max%</yellow>, includes +%extra% extra levels).</red>"
  limitbreak-invalid-target: "<red>This LimitBreak book is for a different enchantment: <aqua>%enchant%</aqua>.</red>"
  limitbreak-not-supported: "<red><aqua>%enchant%</aqua> cannot be upgraded with LimitBreak.</red>"
  limitbreak-locked-pickaxe-level: "<red>Your pickaxe must be <yellow>Level %required%</yellow> to apply LimitBreak to <aqua>%enchant%</aqua>.</red>"
  limitbreak-book-received: "<green>You received <yellow>%amount%x</yellow> <gradient:#FF0055:#FFAA00><b>LimitBreak Book: %enchant% +1</b></gradient>!</green>"
  limitbreak-universal-received: "<green>You received <yellow>%amount%x</yellow> <gradient:#FF00FF:#00FFFF><b>✦ UNIVERSAL SUPER BOOK +1 ✦</b></gradient>!</green>"
  limitbreak-book-given: "<green>Gave <yellow>%amount%x</yellow> LimitBreak book (<aqua>%enchant%</aqua>) to <yellow>%player%</yellow>.</green>"
