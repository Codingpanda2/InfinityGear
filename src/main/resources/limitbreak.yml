# ==============================================================================
#                  INFINITY PICKAXES - LIMIT BREAK CONFIGURATION
# ==============================================================================
# Mechanics for Specific (+1) Enchantment Books and Universal Super Books.

settings:
  # Sound effect played on successful LimitBreak upgrade
  sound:
    enabled: true
    sound: BLOCK_ENCHANTMENT_TABLE_USE
    volume: 1.0
    pitch: 1.4

  # Particle animation on upgrade
  particles:
    enabled: true
    particle: TOTEM_OF_UNDYING
    count: 35

# ------------------------------------------------------------------------------
# Specific (+1) Enchantment Book Template
# ------------------------------------------------------------------------------
specific-book:
  material: ENCHANTED_BOOK
  custom-model-data: 10001
  glowing: true
  display-name: "<gradient:#FF0055:#FFAA00><b>LimitBreak: %enchant_name% +1</b></gradient>"
  lore:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "<gray>Type: <light_purple><b>LimitBreak Tome</b></light_purple>"
    - "<gray>Target: <aqua>%enchant_name%</aqua>"
    - ""
    - "<white><b>SPECIAL EFFECT:</b></white>"
    - "<yellow>• Instantly increases <gold>+1 Level</gold> to this enchantment."
    - "<yellow>• Works regardless of how high the current level is."
    - "<yellow>• Breaks past the maximum level up to <light_purple>+%max_extra% extra levels</light_purple>."
    - ""
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "<green><i>Click socket in /pickaxe or drag onto your pickaxe!</i></green>"

# ------------------------------------------------------------------------------
# Universal Super Book (Omni Tome) Template
# ------------------------------------------------------------------------------
universal-book:
  material: ENCHANTED_BOOK
  custom-model-data: 10002
  glowing: true
  display-name: "<gradient:#FF00FF:#00FFFF><b>✦ UNIVERSAL SUPER BOOK +1 ✦</b></gradient>"
  lore:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "<gray>Type: <gradient:#FF00FF:#00FFFF><b>Primordial Arcane Tome</b></gradient>"
    - "<gray>Target: <white><b>Any Pickaxe Enchantment</b></white>"
    - ""
    - "<white><b>LEGENDARY EFFECT:</b></white>"
    - "<yellow>• Grants <gold>+1 Level</gold> to any enchantment you choose."
    - "<yellow>• Compatible with every socket registered on your pickaxe."
    - "<yellow>• Activates <light_purple>LimitBreak</light_purple> up to <light_purple>+%max_extra% extra levels</light_purple>."
    - ""
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "<green><i>Click any socket in /pickaxe to apply upgrade!</i></green>"
